<head>

<style>
:root{
  --bg:#070709; --panel:#111114; --panel2:#17171b; --text:#f7f2e8;
  --muted:#aaa5a0; --accent:#e0bb8b; --accent2:#b9946d;
  --green:#7ee2a8; --red:#ff7d7d; --line:#2b2a30;
  --shadow:0 28px 100px rgba(0,0,0,.58);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:
radial-gradient(circle at 50% -15%,rgba(224,187,139,.12),transparent 38%),
radial-gradient(circle at 0% 100%,rgba(110,85,60,.08),transparent 32%),
var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
body{overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;
background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.014) 1px,transparent 1px);
background-size:32px 32px;mask-image:linear-gradient(to bottom,black,transparent 92%)}
button{font:inherit}
.app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:14px}
.screen{width:min(920px,100%);min-height:720px;background:linear-gradient(145deg,rgba(15,15,18,.985),rgba(9,9,12,.985));
border:1px solid rgba(224,187,139,.18);border-radius:22px;box-shadow:var(--shadow),0 0 80px rgba(224,187,139,.035);
overflow:hidden;position:relative}
.screen:after{content:"";position:absolute;inset:42px 0 0;pointer-events:none;
background:linear-gradient(180deg,rgba(224,187,139,.028),transparent 25%);border-radius:0 0 22px 22px}
.topbar{height:42px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 15px;color:#777;font-size:12px;position:relative;z-index:2}
.dot{width:10px;height:10px;border-radius:50%;background:#333}
.dot:first-child{background:#7b4f4f}.dot:nth-child(2){background:#806e43}.dot:nth-child(3){background:#4d775b}
.content{padding:clamp(30px,6vw,64px);min-height:678px;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:1}
.kicker{color:var(--accent);font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:18px}
.kicker:before{content:"";display:inline-block;width:20px;height:1px;background:var(--accent);vertical-align:middle;margin-right:9px;opacity:.7}
h1{font-size:clamp(40px,7vw,74px);line-height:.94;margin:0 0 22px;letter-spacing:-.055em;text-wrap:balance}
h2{font-size:clamp(24px,4vw,42px);margin:0 0 18px;line-height:1.08;text-wrap:balance}
p{font-family:Georgia,serif;font-size:clamp(17px,2.2vw,21px);line-height:1.65;color:#e8e1d8}
.mono{font-family:inherit}
.dim{color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{border:1px solid #3b3940;background:#18181d;color:var(--text);padding:14px 19px;border-radius:11px;cursor:pointer;transition:.22s;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.btn:hover{transform:translateY(-2px);border-color:var(--accent);background:#202026}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn.primary{background:linear-gradient(135deg,#e7c698,#d2ab78);color:#17130e;border-color:#e7c698;font-weight:800;box-shadow:0 12px 30px rgba(224,187,139,.16)}
pre{white-space:pre-wrap;line-height:1.7;color:#ddd;margin:0;font-size:clamp(12px,1.7vw,15px)}
.log{background:rgba(5,5,7,.82);border:1px solid var(--line);border-radius:15px;padding:20px;margin:18px 0;min-height:190px;box-shadow:inset 0 1px 0 rgba(255,255,255,.025)}
.line{opacity:0;animation:appear .35s forwards}
@keyframes appear{to{opacity:1}}
.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.progress{height:5px;background:#222;border-radius:99px;overflow:hidden;margin:24px 0 8px}
.progress>span{display:block;height:100%;background:var(--accent);width:0;transition:width .5s}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:20px}
.card{background:linear-gradient(145deg,rgba(17,17,20,.96),rgba(13,13,16,.96));border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;transition:.22s;box-shadow:0 8px 28px rgba(0,0,0,.12)}
.card:hover{border-color:rgba(224,187,139,.55);transform:translateY(-3px);box-shadow:0 14px 34px rgba(0,0,0,.22)}
.card strong{display:block;color:var(--accent);font-size:13px;margin-bottom:9px}
.status{font-size:12px;color:var(--green);margin-top:9px}
.memory{display:grid;grid-template-columns:1fr 1.1fr;gap:20px;align-items:center;margin:24px 0}
.memory img,.memory video{width:100%;max-height:420px;object-fit:cover;border-radius:15px;border:1px solid var(--line);background:#050506;box-shadow:0 18px 45px rgba(0,0,0,.25)}
.quote{border-left:2px solid var(--accent);padding-left:20px}
.heart{font-size:64px;line-height:1;margin:10px 0 22px;filter:drop-shadow(0 8px 24px rgba(224,187,139,.12))}
.center{text-align:center;align-items:center}
.small{font-size:12px;color:var(--muted);letter-spacing:.03em}
.bigmono{font-size:clamp(18px,3vw,28px);line-height:1.55}
.scan{margin:8px 0;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#0a0a0c}
.good{color:var(--green)} .warn{color:#e7c27b}.bad{color:var(--red)}
.back{position:absolute;right:18px;top:52px;font-size:11px;color:#777;background:none;border:0;cursor:pointer}
@media(max-width:650px){
 .app{padding:8px}
 .screen{min-height:calc(100vh - 20px);border-radius:18px}
 .topbar{height:40px;padding:0 12px;font-size:10px}
 .topbar span:last-child{display:none}
 .content{min-height:calc(100vh - 60px);padding:34px 22px 38px;justify-content:flex-start}
 h1{font-size:clamp(38px,11.5vw,58px);line-height:.94;margin-bottom:20px}
 h2{font-size:clamp(24px,7vw,34px)}
 p{font-size:18px;line-height:1.6}
 .row{margin-top:24px}
 .btn.primary{width:100%;padding:16px 18px}
 .log{padding:17px;margin:16px 0;min-height:0}
 pre{font-size:12px;line-height:1.65}
 .cardgrid{grid-template-columns:1fr}
 .memory{grid-template-columns:1fr}
 .memory img,.memory video{max-height:320px}
 .card{padding:16px}
 .back{top:48px;right:12px}
}
</style>
</head>
<body>
<div class="app"><main class="screen">
